; Shared settings for every environment.
[env]
platform  = espressif32
framework = arduino

monitor_speed = 921600
upload_speed  = 921600

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    mprograms/QMC5883LCompass @ ^1.0.2
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=0

extra_scripts =
    pre:scripts/version.py
    pre:scripts/board.py

; ── One environment per board ──────────────────────────
; The environment name is the board id and matches targets/<id>.json, which
; holds the pins, flash layout and status. See docs/boards.md to add one.

[env:esp32dev]
board        = esp32dev
custom_board = esp32dev

[env:esp32-s3-devkitc-1]
board        = esp32-s3-devkitc-1
custom_board = esp32-s3-devkitc-1

; ── Debug ──────────────────────────────────────────────
; The original human-readable CSV stream, for `pio device monitor`.
[env:esp32dev-csv]
board        = esp32dev
custom_board = esp32dev
build_flags =
    ${env.build_flags}
    -DMSNS_WIRE_CSV=1
