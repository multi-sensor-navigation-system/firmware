; Shared settings for every environment.
[env]
platform  = espressif32
framework = arduino

monitor_speed = 921600
upload_speed  = 921600

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    mprograms/QMC5883LCompass @ ^1.0.2
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=0

extra_scripts = pre:scripts/version.py

; Default build: binary wire protocol (docs/wire-protocol.md).
[env:esp32dev]
board = esp32dev

; Debug build: the original human-readable CSV stream, for `pio device monitor`.
[env:esp32dev-csv]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DMSNS_WIRE_CSV=1
