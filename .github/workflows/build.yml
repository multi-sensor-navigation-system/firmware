name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire protocol tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tools/host/test_wire.cpp -o test_wire
          ./test_wire
      - name: Board manifests
        run: python3 tools/check_boards.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio "esptool>=5"
      - name: Build every environment
        run: pio run
      - name: Assemble release images (dry run)
        run: |
          version="$(sed -nE 's/^#define MSNS_FW_VERSION "(.*)"/\1/p' include/version.h)"
          python tools/release.py --tag "v${version}" --out dist
          cat dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: dist/
