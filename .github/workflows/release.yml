name: Release

# Pushing a tag like v0.1.0 builds the firmware and publishes a GitHub
# Release with a single merged image that can be flashed at offset 0x0:
#   esptool.py --chip esp32 write_flash 0x0 msns-firmware-esp32dev-v0.1.0.bin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BOARD: esp32dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio "esptool<5"
      - run: pio run -e "$BOARD"
      - name: Merge into one flashable image
        run: |
          out="msns-firmware-${BOARD}-${GITHUB_REF_NAME}.bin"
          build=".pio/build/${BOARD}"
          boot_app0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          esptool.py --chip esp32 merge_bin -o "$out" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  "$build/bootloader.bin" \
            0x8000  "$build/partitions.bin" \
            0xe000  "$boot_app0" \
            0x10000 "$build/firmware.bin"
          sha256sum "$out" > "$out.sha256"
          echo "IMAGE=$out" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$IMAGE" "$IMAGE.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
